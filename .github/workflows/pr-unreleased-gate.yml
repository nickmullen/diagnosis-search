name: PR Gate – Only one "unreleased" PR allowed

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-unreleased-label-conflict:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any PR (open or closed) has label "unreleased"
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            // Search any PRs (open or closed) with the label
            const q = `repo:${owner}/${repo} is:pr label:"unreleased"`;
            const res = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
            const total = res.data.total_count;

            core.info(`Found ${total} PR(s) with label "unreleased".`);
            if (total > 0) {
              core.setFailed('Merge blocked: another PR already has the "unreleased" label.');
            } else {
              core.info('OK: No PR currently labeled "unreleased".');
            }
